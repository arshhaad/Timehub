{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeHub | Add Funds</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --bg: #0b0b0e;
            --card-bg: #15151a;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --border: #27272a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .payment-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo i {
            color: var(--primary);
        }

        .status-badge {
            background: rgba(30, 64, 175, 0.1);
            color: #3b82f6;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 32px;
        }

        .order-info {
            margin-bottom: 40px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .order-id {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .amount {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .amount span {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .payment-btn {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .payment-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 11, 14, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <div class="logo">
            <i class="fas fa-wallet"></i>
            <span>Wallet Reload</span>
        </div>
        
        <div class="status-badge">Secure Wallet Funding</div>

        <div class="order-info">
            <div class="order-id">Transaction ID: #{{ payment.id }}</div>
            <div class="amount"><span>INR</span>{{ payment.amount }}</div>
        </div>

        <button id="rzp-button1" class="payment-btn">
            <i class="fas fa-shield-alt"></i>
            Complete Secure Reload
        </button>

        <div style="margin-top: 20px;">
            <a href="{% url 'user_wallet' %}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
                <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Cancel and Return to Wallet
            </a>
        </div>

        <div class="footer-note">
            <i class="fas fa-lock"></i>
            Securely processed by Razorpay
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Updating your wallet balance...</p>
    </div>

    <form action="{% url 'payments:verify_wallet_fund' %}" method="POST" id="verify-form" style="display: none;">
        {% csrf_token %}
        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            "key": "{{ razorpay_key }}",
            "amount": "{{ amount }}",
            "currency": "INR",
            "name": "TimeHub Wallet",
            "description": "Wallet Recharge",
            "order_id": "{{ razorpay_order_id }}",
            "handler": function (response){
                document.getElementById('loading-overlay').style.display = 'flex';
                document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
                document.getElementById('razorpay_signature').value = response.razorpay_signature;
                document.getElementById('verify-form').submit();
            },
            "prefill": {
                "name": "{{ request.user.get_full_name }}",
                "email": "{{ request.user.email }}",
                "contact": "{{ request.user.phone_number }}"
            },
            "theme": {
                "color": "#1e40af"
            }
        };
        var rzp1 = new Razorpay(options);
        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
        
        window.onload = function() {
            rzp1.open();
        }
    </script>
</body>
</html>
